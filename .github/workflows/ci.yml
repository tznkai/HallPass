# Root CI of the published HallPass repo. This file exists only at that root (hallpass-repo/ in the monorepo).
# Each project runs the three checks in its README: pytest, ruff and reuse. The root runs reuse over the whole repo.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  project:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [hallpass-web, hallmonitor]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: python -m pytest -q -W error
      - run: ruff check src tests tools
      - run: reuse --root . lint

  licensing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install reuse==6.3.0
      - run: reuse --root . lint
