[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hallmonitor"
version = "0.1.0"
description = "Applies HallPass Console desired state to services"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSES/AGPL-3.0-or-later.txt"]
dependencies = ["httpx>=0.28.1"]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "ruff>=0.17.2",
    "reuse>=6.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hallmonitor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "BLE"]
