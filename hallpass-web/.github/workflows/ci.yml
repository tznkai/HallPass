# GitHub reads workflows only from the repository root. In the monorepo, and in the published HallPass repo where
# this project is hallpass-web/, this file is inert: the root workflow runs the same checks.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: python -m pytest -q -W error
      - run: ruff check src tests tools
      - run: reuse --root . lint
