{% extends "base.html" %}
{% block title %}Hallpass: groups{% endblock %}
{% block content %}
<h1>Groups</h1>
{% if error %}<p class="notice error">{{ error }}</p>{% endif %}
<ul>
  {% for group in groups %}<li><a href="/admin/groups/{{ group.id }}">{{ group.name }}</a></li>
  {% else %}<li>No groups yet.</li>
  {% endfor %}
</ul>
<form method="post" action="/admin/groups" class="stack">
  <input type="hidden" name="csrf" value="{{ csrf_token(request) }}">
  <label>Group name <input name="name" required maxlength="100"></label>
  <button type="submit">Create group</button>
</form>
{% endblock %}
