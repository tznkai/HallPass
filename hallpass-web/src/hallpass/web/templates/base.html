<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Hallpass{% endblock %}</title>
  <style>
    :root { --bg: #fbfbf9; --fg: #1d1d1b; --muted: #5d5d58; --line: #d8d8d2; --accent: #2f5d50; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #161715; --fg: #ecece6; --muted: #a3a39b; --line: #3a3b37; --accent: #8fc7b4; }
    }
    :root[data-theme="dark"] { --bg: #161715; --fg: #ecece6; --muted: #a3a39b; --line: #3a3b37; --accent: #8fc7b4; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
    header, main { padding: 0 16px; max-width: 880px; margin: 0 auto; }
    header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding-top: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
    header a { color: var(--fg); font-weight: 600; text-decoration: none; }
    nav { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    nav a { color: var(--accent); }
    main { padding-top: 16px; padding-bottom: 32px; }
    form.inline { display: inline; }
    button { font: inherit; padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--fg); cursor: pointer; }
    input, select { font: inherit; padding: 6px 8px; max-width: 100%; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--fg); }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
    .notice { border-left: 4px solid var(--accent); padding: 8px 12px; margin: 12px 0; }
    .warning { border-left-color: #b8860b; }
    .error { border-left-color: #b03a2e; }
    .stack > * + * { margin-top: 12px; }
    code { word-break: break-all; }
    .prewrap { white-space: pre-wrap; }
  </style>
</head>
<body>
<header>
  <a href="/">Hallpass</a>
  {% if viewer %}
  <nav>
    {% if is_admin %}
    <a href="/admin/people">People</a>
    <a href="/admin/groups">Groups</a>
    <a href="/admin/terms">Terms</a>
    {% endif %}
    <form method="post" action="/logout" class="inline">
      <input type="hidden" name="csrf" value="{{ csrf_token(request) }}">
      <button type="submit">Sign out</button>
    </form>
  </nav>
  {% endif %}
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
