{% extends "base.html" %}
{% block title %}Hallpass: {{ child.display_name }}{% endblock %}
{% block content %}
<p><a href="/children">All children</a></p>
<h1>{{ child.display_name }}</h1>
{% if error %}<p class="notice error">{{ error }}</p>{% endif %}
<section class="stack">
  <h2>Services</h2>
  <form method="post" action="/children/{{ child.id }}/holds" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf_token(request) }}">
    <input type="hidden" name="service_id" value="all">
    <input type="hidden" name="back" value="child">
    <button type="submit">Revoke everything</button>
  </form>
  {% with back = "child" %}{% include "_service_rows.html" %}{% endwith %}
</section>
{% endblock %}
